[package]
name = "oled-shellmodel"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
description = "The shell model of the suite: program identity, names, version strings and icon sources."
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
oled-sys = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
