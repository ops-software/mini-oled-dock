<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- mini-oled-dock application icon, 256 px master. A black OLED tile (8 px margin, radius 52.8)
       with a 2 px #3A3A3A rim that keeps its edge visible on dark backgrounds, a 4 px white outline
       concentric with the tile (the screen) and a white pill floating low inside it (the dock).
       tools/make-icon.ps1 draws the same geometry per size into assets/dock.ico; keep both in sync. -->
  <rect x="8" y="8" width="240" height="240" rx="52.8" fill="#3A3A3A"/>
  <rect x="10" y="10" width="236" height="236" rx="50.8" fill="#000000"/>
  <rect x="28" y="28" width="200" height="200" rx="32.8" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="75" y="177" width="106" height="20" rx="10" fill="#FFFFFF"/>
</svg>
