name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      regen:
        description: Regenerate the golden images on the runner and upload them (never commits)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Pinned so a new lint cannot turn main red overnight; a bump is a one-line PR with the clippy run attached.
  # release.yml pins the same version: keep the two equal.
  RUST_TOOLCHAIN: 1.93.1

jobs:
  lint:
    runs-on: windows-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.regen) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt --component clippy
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustc -vV

      - name: fmt-changed self-test
        shell: pwsh
        run: pwsh tools/ci/fmt-changed.ps1 -SelfTest

      - name: Format of the lines this change touches
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $base = "origin/$env:GITHUB_BASE_REF" } else { $base = 'HEAD~1' }
          pwsh tools/ci/fmt-changed.ps1 -BaseRef $base

      # The keyed-strings codemod (tools/i18n-codemod, std only, outside the workspace, its own lock file).
      - name: i18n codemod tests
        env:
          CARGO_TARGET_DIR: target-codemod
        run: cargo test --locked --manifest-path tools/i18n-codemod/Cargo.toml

      - name: Clippy
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Features of the dock package: no --workspace, the root package is selected by default.
      # The owner-probe build (launcher L0 sessions and live checks): its switches and probe lines compile only with it.
      - name: Clippy (owner-probe)
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: cargo clippy --locked --all-targets --features owner-probe -- -D warnings

      # The wake-probe build (live wake measurements): its source and call sites compile only with it.
      - name: Clippy (wake-probe)
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: cargo clippy --locked --all-targets --features wake-probe -- -D warnings

      # The kit with its a11y feature (P2-kit K2b.8): oled-ui and the gallery with AccessKit compiled in.
      - name: Clippy (kit a11y)
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: cargo clippy --locked -p oled-ui -p gallery --all-targets --features oled-ui/a11y -- -D warnings

      # Resolver 2 unifies features across the workspace, so a crate that forgot a windows feature builds inside it
      # and breaks alone (an app built with -p): check every member on its own.
      - name: Each member builds alone
        shell: pwsh
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: pwsh tools/ci/gates.ps1 -Only crates

      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\cargo-deny
          key: cargo-deny-0.20.2-975a22143262

      - name: cargo-deny 0.20.2 (prebuilt, SHA-256 verified)
        shell: pwsh
        env:
          DENY_VERSION: '0.20.2'
          DENY_SHA256: '975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc'   # sha256 of the .tar.gz asset
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cargo-deny'
          if (-not (Test-Path "$dir\cargo-deny.exe")) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            $tgz = Join-Path $dir 'cd.tar.gz'
            Invoke-WebRequest "https://github.com/EmbarkStudios/cargo-deny/releases/download/$env:DENY_VERSION/cargo-deny-$env:DENY_VERSION-x86_64-pc-windows-msvc.tar.gz" -OutFile $tgz
            if ((Get-FileHash $tgz -Algorithm SHA256).Hash.ToLower() -ne $env:DENY_SHA256) { throw 'cargo-deny: SHA-256 mismatch' }
            tar -xzf $tgz -C $dir --strip-components=1
          }
          "$dir" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

      - name: cargo deny
        run: cargo deny --locked --workspace check

      # The licences of the a11y feature's extra dependencies (P2-kit K2b.8), checked with the feature on.
      - name: cargo deny (kit a11y)
        run: cargo deny --locked --workspace --features oled-ui/a11y check licenses

  test:
    runs-on: windows-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.regen) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustc -vV

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            target-test
          key: test-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}

      # The test binary must run without a UAC prompt: DOCK_NO_MANIFEST embeds an asInvoker
      # manifest (see build.rs). Separate target dir so the release build keeps its admin manifest.
      - name: Test-count ratchet
        shell: pwsh
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
          RATCHET_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pwsh tools/ci/ratchet.ps1

      # --no-fail-fast: one failing test binary does not hide the result of the binaries after it.
      - name: Tests
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: cargo test --locked --workspace --no-fail-fast

      # Features of the dock package: no --workspace, the root package is selected by default.
      - name: Tests (owner-probe)
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: cargo test --locked --features owner-probe

      - name: Tests (wake-probe)
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: cargo test --locked --features wake-probe

      # CI-only window smoke tests of the kit (P2-kit 0.4 rule 1): they open windows, so they run here and nowhere else.
      - name: Kit window smoke tests
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: cargo test --locked -p gallery -p oled-ui -- --ignored smoke

      # The kit with the a11y feature (K.CI2): its tests, then its idle smoke test (no wake-up with no client attached).
      - name: Kit a11y tests
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: cargo test --locked -p oled-ui -p gallery --features oled-ui/a11y

      - name: Kit a11y smoke tests
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
        run: cargo test --locked -p gallery --features oled-ui/a11y -- --ignored smoke_idle_a11y

      - name: Golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: |
            target-test/tmp/golden
            target-test/tmp/files-golden
          if-no-files-found: ignore
          retention-days: 14

  size:
    runs-on: windows-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.regen) }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustc -vV

      # No DOCK_NO_MANIFEST and the default target dir: the release exe keeps its admin manifest (the size is measured on it).
      - name: Release build
        run: cargo build --release --locked

      - name: Size
        shell: pwsh
        run: |
          $n = (Get-Item target/release/dock.exe).Length
          "dock.exe: $n bytes ($([math]::Round($n / 1024, 1)) KiB)"

      - name: Size ledger
        env:
          DOCK_NO_MANIFEST: "1"
          DOCK_EXE: target/release/dock.exe
          CARGO_TARGET_DIR: target-test
        run: cargo test --locked --test budgets -- --ignored exe_size_within_ledger

      # The kit's minimal app (K.CI2): what the kit adds to an exe, plain (target) and with the a11y feature (target-a11y).
      - name: Release build (kit_min)
        run: cargo build --release --locked -p gallery --example kit_min

      - name: Release build (kit_min, a11y)
        env:
          CARGO_TARGET_DIR: target-a11y
        run: cargo build --release --locked -p gallery --example kit_min --features oled-ui/a11y

      - name: Kit_min size
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
          KIT_MIN_EXE: target/release/examples/kit_min.exe
        run: cargo test --locked -p gallery --test budgets -- --ignored kit_min_size_within_row

      - name: Kit_min size (a11y)
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
          KIT_MIN_ROW: exe_size.kit_min_a11y
          KIT_MIN_EXE: target-a11y/release/examples/kit_min.exe
        run: cargo test --locked -p gallery --test budgets -- --ignored kit_min_size_within_row

      - name: Kit a11y size delta
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
          KIT_MIN_EXE: target/release/examples/kit_min.exe
          KIT_MIN_A11Y_EXE: target-a11y/release/examples/kit_min.exe
        run: cargo test --locked -p gallery --test budgets -- --ignored kit_min_a11y_delta_within_350_kb

      # The files app's release exe (its engine roles until its window lands): row exe_size.files.
      - name: Release build (files)
        run: cargo build -p files --release --locked

      - name: Size (files)
        env:
          DOCK_NO_MANIFEST: "1"
          FILES_EXE: target/release/files.exe
          CARGO_TARGET_DIR: target-test
        run: cargo test --locked --test budgets -- --ignored files_exe_size_within_budget

      # The files preview exe the tester runs (internal build, never installed by CI).
      - uses: actions/upload-artifact@v4
        with:
          name: files-preview
          path: target/release/files.exe
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: dock-release
          path: target/release/dock.exe
          retention-days: 7

  # Launcher query cost (LC-3): the operation-count tests run in the test job; this one times the release build against a
  # reference workload in the same process. The gate is a pending budgets.json row until the owner approves the calibration.
  bench:
    runs-on: windows-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.regen) }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustc -vV

      - name: Launcher bench
        shell: pwsh
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-bench
        run: |
          $ErrorActionPreference = 'Continue'      # cargo writes its progress to stderr
          $out = cargo test --release --locked --bin dock launcher::providers::bench -- --ignored --nocapture 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $out | Write-Host
          if ($code -ne 0) { exit $code }
          # A filter that matches no test passes silently: the job fails unless the bench ran and printed its line.
          if ($out -match 'running 0 tests') { throw 'launcher bench: no test ran' }
          if (-not ($out -match 'bench: launcher \d+ ns')) { throw 'launcher bench: no bench line printed' }

      # Tasks engine benches (P1-tasks-engine TS5, TB1): release; 2x slack on the shared runner.
      - name: oled-sysmon parse bench
        shell: pwsh
        env: { DOCK_NO_MANIFEST: "1", CARGO_TARGET_DIR: target-bench, OLED_BENCH_SLACK: "2" }
        run: |
          $ErrorActionPreference = 'Continue'
          $out = cargo test --release --locked -p oled-sysmon --test parse_bench -- --ignored --nocapture 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $out | Write-Host
          if ($code -ne 0) { exit $code }
          if ($out -match 'running 0 tests') { throw 'parse bench: no test ran' }
          if (-not ($out -match 'bench: sysmon_parse_300 p50 \d+ us')) { throw 'parse bench: no bench line printed' }
      - name: tasks model bench
        shell: pwsh
        env: { DOCK_NO_MANIFEST: "1", CARGO_TARGET_DIR: target-bench, OLED_BENCH_SLACK: "2" }
        run: |
          $ErrorActionPreference = 'Continue'
          $out = cargo test --release --locked -p tasks --test model_bench -- --ignored --nocapture 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $out | Write-Host
          if ($code -ne 0) { exit $code }
          if ($out -match 'running 0 tests') { throw 'model bench: no test ran' }
          if (-not ($out -match 'bench: tasks_model_tick p50 \d+ us')) { throw 'model bench: no bench line printed' }

      # The files engine's benches (release) and serial timings (debug: the fault hooks exist there). Every fn bench_ and
      # fn timing_ under apps/files must print its "bench: files <name> " line; targets without one print "running 0
      # tests", which is not checked. Until the first one lands, each step says so and passes.
      - name: Files benches (release, serial)
        shell: pwsh
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-bench
          OLED_BENCH_SLACK: "2"      # 2x slack on the shared runner, as the benches above
        run: |
          $names = @(git grep -h -o -E 'fn bench_[a-z0-9_]+' -- apps/files | ForEach-Object { $_ -replace '^fn bench_', '' } | Sort-Object -Unique)
          if ($names.Count -eq 0) { 'no files benches yet'; exit 0 }
          $ErrorActionPreference = 'Continue'      # cargo writes its progress to stderr
          $out = cargo test -p files --release --locked --no-fail-fast -- --ignored bench_ --nocapture --test-threads=1 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $out | Write-Host
          if ($code -ne 0) { exit $code }
          $missing = @($names | Where-Object { -not ($out -match "bench: files $([regex]::Escape($_)) ") })
          if ($missing.Count -gt 0) { throw "files benches without their bench line: $($missing -join ', ')" }

      - name: Files timings (debug, serial)
        shell: pwsh
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-bench
        run: |
          $names = @(git grep -h -o -E 'fn timing_[a-z0-9_]+' -- apps/files | ForEach-Object { $_ -replace '^fn timing_', '' } | Sort-Object -Unique)
          if ($names.Count -eq 0) { 'no files benches yet (no fn timing_ under apps/files)'; exit 0 }
          $ErrorActionPreference = 'Continue'      # cargo writes its progress to stderr
          cargo build -p files --examples --locked 2>&1 | ForEach-Object { "$_" } | Write-Host     # the fault DLL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = cargo test -p files --locked -- --ignored timing_ --nocapture --test-threads=1 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $out | Write-Host
          if ($code -ne 0) { exit $code }
          $missing = @($names | Where-Object { -not ($out -match "bench: files $([regex]::Escape($_)) ") })
          if ($missing.Count -gt 0) { throw "files timings without their bench line: $($missing -join ', ')" }

  # Kit benches (P2-kit K.CI1, K.CI2): the gallery's release benches, each gated against its budgets.json row (x 1.5 under CI).
  # The job fails unless every bench ran and printed its line; the field bench (bench_field) runs after them.
  kit-bench:
    runs-on: windows-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.regen) }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustc -vV

      - name: Kit bench
        shell: pwsh
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-bench
        run: |
          $ErrorActionPreference = 'Continue'      # cargo writes its progress to stderr
          $out = cargo test --release --locked -p gallery --test bench -- --ignored --nocapture 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $out | Write-Host
          if ($code -ne 0) { exit $code }
          # A filter that matches no test passes silently: the job fails unless each bench ran and printed its line.
          if ($out -match 'running 0 tests') { throw 'kit bench: no test ran' }
          foreach ($name in 'raster_4k_settings_like', 'table_hover', 'table_text_40x4', 'scroll_strip', 'table_4k_full') {
            if (-not ($out -match ('\{"bench":"' + $name + '"'))) { throw "kit bench: no bench line for $name" }
          }

      # The field bench (K2b.3): a keystroke to the repainted field, with its own guard and line check.
      - name: Kit field bench
        shell: pwsh
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-bench
        run: |
          $ErrorActionPreference = 'Continue'      # cargo writes its progress to stderr
          $out = cargo test --release --locked -p gallery --test bench_field -- --ignored --nocapture 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $out | Write-Host
          if ($code -ne 0) { exit $code }
          if ($out -match 'running 0 tests') { throw 'kit field bench: no test ran' }
          if (-not ($out -match '\{"bench":"field_key"')) { throw 'kit field bench: no bench line for field_key' }

  regen-golden:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.regen }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustc -vV

      # Never commits and never pushes: the owner downloads the artifact, looks at the PNGs and commits them.
      - name: Regenerate goldens
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
          GOLDEN_CI_REGEN: "1"
          UPDATE_GOLDEN: "1"
        run: cargo test --locked --test golden

      # Guarded: the target lands with the files window goldens; until then the step and its upload are skipped.
      - name: Regenerate files goldens
        if: ${{ hashFiles('apps/files/tests/golden.rs') != '' }}
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
          GOLDEN_CI_REGEN: "1"
          UPDATE_GOLDEN: "1"
        run: cargo test --locked -p files --test golden

      # Never committed by the job: the owner downloads files-golden-regen, looks at the PNGs and commits them.
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('apps/files/tests/golden.rs') != '' }}
        with:
          name: files-golden-regen
          path: apps/files/tests/golden/base
          retention-days: 14

      - name: Regenerate kit goldens
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
          GOLDEN_CI_REGEN: "1"
          UPDATE_GOLDEN: "1"
        run: cargo test --locked -p gallery --test golden

      - name: Regenerate tasks goldens
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
          GOLDEN_CI_REGEN: "1"
          UPDATE_GOLDEN: "1"
        run: cargo test --locked -p tasks -- golden_

      - uses: actions/upload-artifact@v4
        with:
          name: golden-regen
          path: |
            tests/golden
            apps/gallery/tests/golden/base
            apps/tasks/tests/golden/base
          retention-days: 14
