name: Release

# Push a tag `vX.Y.Z` (matching `version` in Cargo.toml) to build and publish a release.
# Release notes are read from `.github/release-notes/vX.Y.Z.md` when that file exists.
# `workflow_dispatch` rebuilds an existing tag and replaces the assets of its release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and publish (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Keep equal to ci.yml: the release exe is built by the toolchain CI tested.
      RUST_TOOLCHAIN: 1.93.1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches Cargo.toml
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { Write-Error "Tag $env:TAG does not match Cargo.toml version $v"; exit 1 }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustc -vV

      - name: Tests
        env:
          DOCK_NO_MANIFEST: "1"
          CARGO_TARGET_DIR: target-test
          # Anti-aliasing drift of a new runner image only warns; Size and Exact mismatches still fail.
          GOLDEN_TEXT_ADVISORY: "1"
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/dock.exe dist/dock.exe
          $h = (Get-FileHash dist/dock.exe -Algorithm SHA256).Hash.ToLower()
          $p = Join-Path $PWD 'dist/dock.exe.sha256'
          [System.IO.File]::WriteAllText($p, "$h  dock.exe`n", [System.Text.UTF8Encoding]::new($false))
          if ([System.IO.File]::ReadAllBytes($p) -contains 13) { throw 'CR in dock.exe.sha256' }
          $notes = ".github/release-notes/$env:TAG.md"
          if (Test-Path $notes) { Copy-Item $notes dist/notes.md } else { "mini-oled-dock $env:VERSION" | Out-File -Encoding utf8 dist/notes.md }
          "`n---`n`n**SHA256** of ``dock.exe``: ``$h``" | Add-Content -Encoding utf8 dist/notes.md

      - name: Publish
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist/dock.exe dist/dock.exe.sha256 --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            gh release edit $env:TAG --notes-file dist/notes.md
          } else {
            gh release create $env:TAG dist/dock.exe dist/dock.exe.sha256 --verify-tag --title "mini-oled-dock $env:VERSION" --notes-file dist/notes.md
          }

      # GitHub's own SHA-256 of the uploaded asset, which the updater also checks, must be the built file's.
      # `// empty`: a null digest prints nothing (a warning here), not the string "null" (a failure).
      - name: Uploaded dock.exe matches the build
        run: |
          $h = (Get-FileHash dist/dock.exe -Algorithm SHA256).Hash.ToLower()
          $d = gh api "repos/$env:GH_REPO/releases/tags/$env:TAG" --jq '.assets[] | select(.name == "dock.exe") | .digest // empty'
          if (-not $d) { "::warning::GitHub reports no digest for dock.exe; clients check dock.exe.sha256 only"; exit 0 }
          if ($d -ne "sha256:$h") { Write-Error "GitHub's digest $d differs from the built dock.exe (sha256:$h)"; exit 1 }
          "dock.exe digest matches: $d"
