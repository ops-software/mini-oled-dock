[package]
name = "gallery"
version = "1.7.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "gallery"
path = "src/main.rs"

[[bin]]
name = "band_capture"
path = "src/bin/band_capture.rs"

# Dev only, never shipped and never built by release.yml. The a11y build is `--features oled-ui/a11y`.
[dependencies]
oled-ui = { workspace = true }
oled-sys = { workspace = true }
oled-config = { workspace = true }
serde_json = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5.1"
