[package]
name = "tasks"
version = "1.6.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
oled-sysmon = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Services", "Win32_System_SystemInformation",
    "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[[example]]
name = "testee"
test = true
[[example]]
name = "trace_record"
test = true
[[example]]
name = "sampler_bench"
test = true
