[package]
name = "dock"
version = "1.6.0"
edition = "2021"
rust-version = "1.87"
description = "A minimal, ultra-light, OLED-black floating dock for Windows 11, written in Rust with no UI framework."
license = "MIT"
repository = "https://github.com/ops-software/mini-oled-dock"
readme = "README.md"
keywords = ["windows", "dock", "taskbar", "oled", "win32"]
categories = ["os::windows-apis", "gui"]
build = "build.rs"

[workspace]
members = ["crates/*", "apps/*"]
exclude = ["tools/i18n-codemod"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-core = "0.62.2"
windows-future = "0.3.2"
windows-collections = "0.3.2"
windows = "0.62.2"
oled-trust = { path = "crates/oled-trust", version = "0.0.0" }
oled-sys = { path = "crates/oled-sys", version = "0.0.0" }
oled-ui = { path = "crates/oled-ui", version = "0.0.0" }
oled-i18n-build = { path = "crates/oled-i18n-build", version = "0.0.0" }
# L-T (P1-tasks-engine)
oled-sysmon = { path = "crates/oled-sysmon", version = "0.0.0" }
# L-P (P2-plumbing)
oled-config = { path = "crates/oled-config", version = "0.0.0" }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
windows-core = { workspace = true }
# IAsyncOperation / AsyncOperationCompletedHandler and IVectorView are NOT re-exported by `windows`
# (needed for the WinRT notification listener): same versions already in Cargo.lock as dependencies of `windows`.
windows-future = { workspace = true }
windows-collections = { workspace = true }
oled-config = { workspace = true }
oled-sys = { workspace = true }
oled-sysmon = { workspace = true }
oled-trust = { workspace = true }
oled-ui = { workspace = true }
windows = { workspace = true, features = [
    "ApplicationModel",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    # Spatial sound selector of the audio popup (SpatialAudioDeviceConfiguration, SpatialAudioFormatSubtype).
    "Media_Audio",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    # The files helper only (`dock.exe --launcher-files`, files_child.rs): Windows Search through OLE DB, and WSearch's state.
    "Win32_System_Search",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Inert until the drawing code moves: the feature switches on counters that only tests read.
oled-ui = { workspace = true, features = ["test-counters"] }

[build-dependencies]
oled-i18n-build = { workspace = true }
embed-manifest = "1.5.1"
winresource = "0.1.19"

[features]
default = []
# Owner-probe builds (launcher L0 sessions): compiles in the probe switches and probe log lines, nothing else.
owner-probe = []
# Wake-probe builds (live wake measurements, P0-wsC-v2): compiles in src/probe.rs and its call sites, nothing else.
wake-probe = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Tests run optimised: the launcher bench and the golden images take minutes unoptimised.
# Debug assertions and overflow checks stay on (inherited from the dev profile).
[profile.test]
opt-level = 1
