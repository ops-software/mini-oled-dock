# cargo-deny 0.20.2 (CI only: tools/ci and .github/workflows/ci.yml; not installed on dev machines).
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Extend ONLY with what the first CI run reports, each checked in the crate's own repository.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"      # syn appears twice in Cargo.lock; a hard ban would fail on a build-only duplicate
wildcards = "deny"
allow-wildcard-paths = true     # path dependencies without versions are not wildcards from crates.io

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
