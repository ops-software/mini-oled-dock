[package]
name = "launcher-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Read-only probe for the launcher's L0 owner session. Writes only to stdout; never opens a handle for writing."
license = "MIT"
publish = false

# Own project: not part of any workspace, built with CARGO_TARGET_DIR=target-spike.
[workspace]

[dependencies]
serde_json = "1.0.154"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Search",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
